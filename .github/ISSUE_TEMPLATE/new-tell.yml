name: New tell
description: A sign of machine-written Turkmen that no current pattern catches.
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: Example
      description: Real text that shows the tell. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: How a person would write it
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why no current pattern covers it
      description: Name the closest pattern in references/ai-patterns.md or references/turkmen-tells.md and say why it misses this.
    validations:
      required: true
