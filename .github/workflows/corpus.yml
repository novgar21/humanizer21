name: Corpus run

# Sends every corpus case to the model and grades the answers.
# One full run costs about 8 USD in API credits, so it runs only by hand:
# Actions > Corpus run > Run workflow. Run it before a release that changes
# SKILL.md, references/ or prompts/.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "skill (SKILL.md) or prompt (prompts/system-prompt.md)"
        type: choice
        options: [skill, prompt]
        default: skill
      runs:
        description: "Answers per case"
        default: "3"

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python3 -m pip install --quiet uv==0.11.32
      - name: Run the corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          uv run --no-project --with anthropic==2.3.0 python tests/run_corpus.py
          --variant "${{ inputs.variant || 'skill' }}"
          --runs "${{ inputs.runs || '3' }}"
      - name: Keep the answers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-results
          path: corpus-results/
          if-no-files-found: ignore
